[package]
name = "insiedr-amsi"
version = "2.0.0"
edition = "2021"
authors = ["InsiEDR Security Team"]
description = "Native Windows AMSI Provider Dynamic Library"

[lib]
name = "insiedr_amsi"
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
